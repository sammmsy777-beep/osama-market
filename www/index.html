<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سوق أسامة — نظام الإدارة المتكامل</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🛒%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@200..700&display=swap" rel="stylesheet">
<style>
/* ===== Osama Market — Phase 1 Prototype (Build 1.4 · SYP · date-safe) ===== */
:root{
  --primary:#1ABC9C; --primary-light:#5FD3C4; --primary-dark:#128C7E;
  --bg:#F5F7F7; --bg2:#EFF4F4; --card:#FFFFFF; --ink:#1F2D2B; --muted:#7A8A87; --line:#E4EBEA;
  --green:#2EAF7D; --red:#E06A6A; --orange:#EFA24A;
  --tint:rgba(26,187,156,.10);
  --rad:18px; --sh:0 2px 10px rgba(18,140,126,.06),0 1px 3px rgba(0,0,0,.04);
  --sh2:0 12px 34px rgba(18,140,126,.16); --sbw:252px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:'Readex Pro',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:inherit;text-decoration:none;cursor:pointer}
::selection{background:rgba(26,187,156,.25)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#CFDEDB;border-radius:99px;border:2px solid var(--bg)}
.hidden{display:none!important}
.muted{color:var(--muted)} .small{font-size:12px} .flex{display:flex;align-items:center;gap:8px}
body.lock{overflow:hidden}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:14px;font-weight:600;transition:all .2s;border:1.5px solid transparent;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-pr{background:var(--primary);color:#fff;box-shadow:0 6px 16px rgba(26,187,156,.30)}
.btn-pr:hover{background:#17AE90}
.btn-soft{background:var(--tint);color:var(--primary-dark)}
.btn-soft:hover{background:rgba(26,187,156,.18)}
.btn-ghost{background:#fff;border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--primary-light);color:var(--primary-dark)}
.btn-danger{background:#FDECEC;color:#C0453E}
.btn-danger:hover{background:#FADADA}
.btn-solid-danger{background:var(--red);color:#fff;box-shadow:0 6px 16px rgba(224,106,106,.3)}
.btn-solid-danger:hover{background:#D25B5B}
.btn:disabled{opacity:.5;pointer-events:none}
.btn-lg{padding:14px 26px;font-size:16px;border-radius:16px;width:100%}
.icon-btn{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:#fff;border:1px solid var(--line);color:#5C6F6B;transition:all .2s;flex-shrink:0}
.icon-btn:hover{color:var(--primary-dark);border-color:var(--primary-light)}
.icon-btn.sm{width:34px;height:34px;border-radius:10px}
.inp,select.inp,textarea.inp{width:100%;padding:11px 14px;border-radius:13px;border:1.5px solid var(--line);background:#fff;outline:none;transition:border .2s,box-shadow .2s}
.inp:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(26,187,156,.15)}
.lbl{display:block;font-size:13px;font-weight:600;color:#4A5B58;margin-bottom:6px}
.field{margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:99px;background:#fff;border:1.5px solid var(--line);font-weight:500;font-size:13px;color:#5C6F6B;transition:all .2s;white-space:nowrap}
button.chip:hover{border-color:var(--primary-light);color:var(--primary-dark)}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(26,187,156,.3)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.b-green{background:#E5F5EC;color:#1F8B4C} .b-red{background:#FDECEC;color:#C0453E}
.b-orange{background:#FDF3E3;color:#B26B12} .b-teal{background:var(--tint);color:var(--primary-dark)}
.b-gray{background:#EEF2F2;color:#6B7C79}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--rad);box-shadow:var(--sh);padding:20px}
.card h3{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.seg{display:flex;background:var(--bg2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:10px;border-radius:11px;font-weight:600;color:#6B7C79;transition:all .2s}
.seg button.on{background:#fff;color:var(--primary-dark);box-shadow:var(--sh)}
.seg button:disabled{opacity:.45;cursor:not-allowed}
.tgl{position:relative;width:48px;height:28px;flex-shrink:0;display:inline-block}
.tgl input{opacity:0;width:100%;height:100%;position:absolute;cursor:pointer;z-index:2;margin:0}
.tgl .tr{position:absolute;inset:0;background:#D6E0DF;border-radius:99px;transition:background .2s}
.tgl .tr::after{content:'';position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:3px;inset-inline-start:3px;transition:inset-inline-start .2s;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.tgl input:checked+.tr{background:var(--primary)}
.tgl input:checked+.tr::after{inset-inline-start:23px}

.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(1100px 600px at 85% -10%,rgba(26,187,156,.18),transparent),radial-gradient(900px 500px at 10% 110%,rgba(95,211,196,.16),transparent),var(--bg)}
.login-card{width:100%;max-width:440px;padding:36px 30px;text-align:center}
.brand-big{width:76px;height:76px;border-radius:24px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;display:grid;place-items:center;margin:0 auto 14px;box-shadow:0 12px 28px rgba(26,187,156,.4)}
.login-card h1{font-size:24px;font-weight:700}
.user-pick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0 6px}
.up{padding:16px 10px;border:2px solid var(--line);border-radius:18px;display:flex;flex-direction:column;gap:8px;align-items:center;transition:all .2s;background:#fff}
.up:hover{border-color:var(--primary-light)}
.up.on{border-color:var(--primary);background:var(--tint)}
.up .up-ic{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;background:var(--bg2);color:var(--primary-dark);transition:all .2s}
.up.on .up-ic{background:var(--primary);color:#fff}
.up b{font-size:14px} .up small{color:var(--muted);font-size:11px}
.pin-dots{display:flex;gap:12px;justify-content:center;margin:16px 0}
.pdot{width:15px;height:15px;border-radius:50%;border:2px solid var(--primary-light);transition:all .15s}
.pdot.f{background:var(--primary);border-color:var(--primary);transform:scale(1.1)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:280px;margin:0 auto}
.key{height:56px;border-radius:16px;background:var(--bg2);font-size:20px;font-weight:600;color:var(--ink);transition:all .15s}
.key:hover{background:var(--tint)} .key:active{transform:scale(.94)}
.key.fn{font-size:12.5px;color:var(--muted);background:transparent}
.demo-hint{margin-top:18px;background:var(--tint);border-radius:13px;padding:10px 14px;font-size:12.5px;color:var(--primary-dark);font-weight:500}
.shake{animation:shake .4s}

.sidebar{position:fixed;inset-inline-start:0;top:0;bottom:0;width:var(--sbw);background:#fff;border-inline-end:1px solid var(--line);display:flex;flex-direction:column;z-index:40;padding:18px 14px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px;border-bottom:1px solid var(--line);margin-bottom:14px}
.brand-ic{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(26,187,156,.35);flex-shrink:0}
.brand b{font-size:17px;font-weight:700;display:block;line-height:1.3}
.brand small{color:var(--muted);font-size:10.5px;font-weight:400}
.side-nav{flex:1}
.nav-it{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:14px;color:#5C6F6B;font-weight:500;margin-bottom:4px;transition:all .2s;width:100%;text-align:start}
.nav-it .ni-ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--bg2);color:#7A8A87;transition:all .2s;flex-shrink:0}
.nav-it:hover{background:var(--bg2)}
.nav-it.active{background:var(--tint);color:var(--primary-dark);font-weight:700}
.nav-it.active .ni-ic{background:var(--primary);color:#fff;box-shadow:0 5px 14px rgba(26,187,156,.35)}
.side-foot{border-top:1px solid var(--line);padding:14px 10px 4px;font-size:11px;color:var(--muted);line-height:1.9}
.main{margin-inline-start:var(--sbw);min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 28px;background:rgba(245,247,247,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.tb-titles h1{font-size:19px;font-weight:700;line-height:1.35}
.tb-titles p{font-size:12.5px;color:var(--muted)}
.tb-side{display:flex;align-items:center;gap:10px}
.user-chip{background:var(--tint);color:var(--primary-dark);border-color:transparent;font-weight:600}
.view-wrap{padding:26px 28px 60px;max-width:1280px;width:100%;margin-inline:auto}
@keyframes viewIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.view.anim{animation:viewIn .28s ease}
.bottomnav{display:none;position:fixed;bottom:0;inset-inline:0;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:50;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.bn-it{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:#7A8A87;padding:4px 2px}
.bn-it.active{color:var(--primary-dark)}
.bni{width:42px;height:30px;display:grid;place-items:center;border-radius:10px;transition:background .2s}
.bn-it.active .bni{background:var(--tint)}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:16px;margin-bottom:20px}
.kpi{display:flex;align-items:center;gap:14px;padding:18px;cursor:pointer;transition:transform .2s,box-shadow .2s;position:relative}
.kpi:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.kpi-ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;flex-shrink:0}
.kpi-val{font-size:19px;font-weight:700;line-height:1.35}
.kpi-lbl{color:var(--muted);font-size:12.5px;font-weight:500}
.kpi-delta{position:absolute;top:13px;inset-inline-end:13px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px}
.quick-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-2-1{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.mini-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.mini-row:last-child{border-bottom:none}

.chart{display:flex;gap:6px;align-items:flex-end;height:175px;padding-top:12px}
.ch-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;min-width:0}
.ch-bars{flex:1;display:flex;align-items:flex-end;gap:3px;width:100%;justify-content:center}
.ch-b{width:9px;border-radius:6px 6px 2px 2px;min-height:3px;transition:height .5s}
.ch-b.p{background:linear-gradient(180deg,var(--primary-light),var(--primary))}
.ch-b.g{background:linear-gradient(180deg,#A9C4BF,#5E7D77)}
.ch-col span{font-size:10.5px;color:var(--muted)}
.lgd{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-inline-start:12px}
.lgd i{width:10px;height:10px;border-radius:3px;display:inline-block}

.tbl-wrap{overflow-x:auto;border-radius:14px;border:1px solid var(--line)}
table.tbl{width:100%;border-collapse:collapse;min-width:660px;background:#fff}
.tbl th{padding:11px 14px;text-align:start;font-size:12px;font-weight:600;color:var(--muted);background:var(--bg2);border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{transition:background .15s}
.tbl tbody tr:hover{background:#FAFCFC}
.tbl .nm{font-weight:600}

.pos-grid{display:grid;grid-template-columns:1fr 362px;gap:18px;align-items:start}
.pos-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search-box{position:relative;flex:1;min-width:220px}
.search-box .inp{padding-inline-start:42px}
.search-box svg{position:absolute;inset-inline-start:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.cat-row{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 4px}
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px;margin-top:12px}
.prod-card{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:13px;text-align:start;transition:all .2s;display:flex;flex-direction:column;gap:6px}
.prod-card:hover{border-color:var(--primary);box-shadow:var(--sh);transform:translateY(-2px)}
.prod-card:active{transform:scale(.98)}
.pc-emoji{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-size:23px}
.pc-name{font-weight:600;font-size:13px;line-height:1.45;min-height:38px}
.pc-price{font-weight:700;color:var(--primary-dark);font-size:14.5px}
.pc-stock{font-size:11px;color:var(--muted)}
.pc-stock.low{color:#B26B12;font-weight:600} .pc-stock.out{color:#C0453E;font-weight:700}
.prod-card.out{opacity:.55}
.cart-panel{position:sticky;top:88px}
.ci{display:flex;flex-direction:column;gap:7px;padding:11px 0;border-bottom:1px dashed var(--line)}
.ci-top{display:flex;justify-content:space-between;gap:8px}
.ci-name{font-weight:600;font-size:13.5px}
.ci-unit{display:block;font-size:11.5px;color:var(--muted);font-weight:400}
.ci-del{color:#C0453E;display:grid;place-items:center;width:30px;height:30px;border-radius:9px;transition:background .15s}
.ci-del:hover{background:#FDECEC}
.ci-ctrl{display:flex;align-items:center;justify-content:space-between;gap:8px}
.qty{display:inline-flex;align-items:center;gap:2px;background:var(--bg2);border-radius:11px;padding:2px}
.qty button{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:var(--primary-dark);font-weight:700;font-size:16px;transition:background .15s}
.qty button:hover{background:#fff}
.qty b{min-width:28px;text-align:center;font-size:13.5px}
.ci-total{font-weight:700;font-size:13.5px;color:var(--primary-dark)}
.tot-row{display:flex;justify-content:space-between;padding:5px 0;font-size:13.5px}
.tot-row.gr{font-size:17px;font-weight:700;color:var(--primary-dark);border-top:2px solid var(--ink);margin-top:8px;padding-top:11px}
.pay-opt{display:flex;align-items:center;gap:12px;border:2px solid var(--line);border-radius:16px;padding:14px;transition:all .2s;width:100%;text-align:start}
.pay-opt.on{border-color:var(--primary);background:var(--tint)}
.pay-opt .po-ic{width:44px;height:44px;border-radius:13px;background:var(--bg2);display:grid;place-items:center;color:var(--primary-dark)}
.pay-opt.on .po-ic{background:var(--primary);color:#fff}
.pos-hints{margin-top:14px;font-size:11.5px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.pos-hints kbd{background:#fff;border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-family:inherit;font-size:11px}

.rf-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.rf-name{font-weight:600;font-size:13.5px}
.rf-name span{display:block;font-weight:400}
.rf-line{min-width:80px;text-align:end;font-weight:700;font-size:13px;color:var(--primary-dark)}
.impact{background:var(--bg2);border-radius:13px;padding:12px 16px;margin:12px 0}
.impact li{margin-inline-start:16px;font-size:13px;padding:2px 0}

.inv{font-size:13px}
.inv table{width:100%;border-collapse:collapse;margin:10px 0}
.inv th,.inv td{padding:7px 6px;border-bottom:1px dashed var(--line);text-align:start;font-size:12.5px}
.inv-tot{display:flex;justify-content:space-between;padding:4px 0;font-weight:600}
.inv-tot.gr{font-size:16px;color:var(--primary-dark);border-top:2px solid var(--ink);margin-top:6px;padding-top:9px}
.inv-meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}

.modal-backdrop{position:fixed;inset:0;background:rgba(23,45,42,.45);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:18px;opacity:0;transition:opacity .22s;z-index:100;overflow:auto}
.modal-backdrop.show{opacity:1}
.modal{background:#fff;border-radius:22px;box-shadow:var(--sh2);width:100%;max-width:530px;max-height:92vh;overflow:auto;padding:24px;transform:translateY(16px) scale(.98);transition:transform .24s cubic-bezier(.2,.9,.3,1.15)}
.modal-backdrop.show .modal{transform:none}
.modal.lg{max-width:780px}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px}
.modal-head h3{font-size:17px;font-weight:700;display:flex;align-items:center;gap:9px}
#overlayRoot .modal-backdrop{z-index:120;background:rgba(23,45,42,.55)}
#overlayRoot .modal{max-width:400px;text-align:center}
#toastRoot{position:fixed;bottom:26px;inset-inline:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:200;pointer-events:none;padding:0 16px}
.toast{background:#20322F;color:#fff;padding:12px 22px;border-radius:14px;font-size:13.5px;font-weight:500;box-shadow:var(--sh2);display:flex;gap:9px;align-items:center;animation:toastIn .3s cubic-bezier(.2,.9,.3,1.2);max-width:92vw}
.toast.success{background:var(--green)} .toast.error{background:#D25B5B} .toast.warn{background:var(--orange)}
.toast.out{animation:toastOut .3s forwards}
.empty{padding:34px 16px;text-align:center;color:var(--muted)}
.empty svg{opacity:.4;margin-bottom:8px}
.alert-strip{display:flex;align-items:center;gap:10px;background:#FDF3E3;border:1px solid #F5DDB8;color:#8A5A10;border-radius:14px;padding:11px 16px;font-size:13.5px;font-weight:500;margin-bottom:16px;flex-wrap:wrap}
.more-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.more-it{display:flex;flex-direction:column;align-items:center;gap:9px;padding:18px 10px;border:1.5px solid var(--line);border-radius:18px;font-weight:600;transition:all .2s;background:#fff}
.more-it:hover{border-color:var(--primary);background:var(--tint)}
.more-it .ni-ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--bg2);color:var(--primary-dark)}

@keyframes shake{0%,100%{transform:none}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.95)}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px)}}
@media print{
  body *{visibility:hidden!important}
  .print-area,.print-area *{visibility:visible!important}
  .print-area{position:fixed;inset:0;width:100%;background:#fff;padding:24px;box-shadow:none;border:none}
  .no-print{display:none!important}
}
@media(max-width:1100px){.pos-grid{grid-template-columns:1fr}.cart-panel{position:static}.grid-2,.grid-2-1{grid-template-columns:1fr}}
@media(max-width:920px){
  .sidebar{display:none}.main{margin-inline-start:0}.bottomnav{display:flex}
  .view-wrap{padding:18px 16px 110px}.topbar{padding:12px 16px}.date-chip{display:none}
}
@media(max-width:640px){
  .kpi-grid{grid-template-columns:1fr 1fr}.prod-grid{grid-template-columns:repeat(auto-fill,minmax(135px,1fr))}
  .tb-titles p{display:none}.user-chip span{display:none}
}
@media(max-width:420px){.kpi-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="root"></div>

/* ---- date layer (RangeError-proof) ---- */
function safeDate(d){
  var x;
  if(d instanceof Date){x=new Date(d.getTime())}
  else if(typeof d==='number'){x=new Date(d)}
  else{x=new Date(String(d))}
  if(isNaN(x.getTime()))return new Date(); /* invalid → now (never throws) */

}

function fmtDT(d){return DF_DT.format(safeDate(d))}
function fmtLong(d){return DF_LONG.format(safeDate(d))}
function fmtFull(d){return DF_FULL.format(safeDate(d))}
function addDays(d,n){var x=safeDate(d);x.setDate(x.getDate()+n);return x}
function sameDay(a,b){var x=safeDate(a),y=safeDate(b);return x.getFullYear()===y.getFullYear()&&x.getMonth()===y.getMonth()&&x.getDate()===y.getDate()}

function lastDays(n){var arr=[];for(var i=n-1;i>=0;i--){var d=addDays(new Date(),-i);var list=DB.sales.filter(function(s){return sameDay(s.date,d)&&s.status!=='voided'});arr.push({lbl:String(d.getDate()),net:list.reduce(function(a,s){return a+s.total},0),profit:list.reduce(function(a,s){return a+s.profit},0)})}return arr}
function chartBars(days){
 var max=Math.max.apply(null,days.map(function(d){return d.net}).concat([1]));
 return '<div class="chart">'+days.map(function(d){
  return '<div class="ch-col" title="'+d.lbl+': مبيعات '+money(d.net)+' · ربح '+money(d.profit)+'"><div class="ch-bars"><div class="ch-b p" style="height:'+Math.round(d.net/max*100)+'%"></div><div class="ch-b g" style="height:'+Math.round(d.profit/max*100)+'%"></div></div><span>'+d.lbl+'</span></div>'
 }).join('')+'</div>'}
var TINTS={teal:['#128C7E','rgba(26,187,156,.12)'],green:['#1F8B4C','#E5F5EC'],red:['#C0453E','#FDECEC'],orange:['#B26B12','#FDF3E3'],gray:['#5C6F6B','#EEF2F2'],blue:['#2C6E9B','#E9F3FB']};
function kpi(ic,tint,html,onclick){return '<div class="card kpi" onclick="'+onclick+'"><div class="kpi-ic" style="background:'+tint[1]+';color:'+tint[0]+'">'+icon(ic,24)+'</div><div>'+html+'</div></div>'}

/* ---------- modals / overlays / toasts ---------- */
var modalRoot=el('modalRoot'),overlayRoot=el('overlayRoot'),toastRoot=el('toastRoot');
function syncLock(){document.body.classList.toggle('lock',!!(modalRoot.innerHTML||overlayRoot.innerHTML))}
function openModal(html,size){modalRoot.innerHTML='<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal '+(size||'')+'">'+html+'</div></div>';requestAnimationFrame(function(){var b=modalRoot.firstElementChild;if(b)b.classList.add('show')});syncLock()}
function closeModal(){var b=modalRoot.firstElementChild;if(!b)return;b.classList.remove('show');setTimeout(function(){modalRoot.innerHTML='';syncLock()},200)}
function openOverlay(html){overlayRoot.innerHTML='<div class="modal-backdrop" onclick="if(event.target===this)closeOverlay()"><div class="modal">'+html+'</div></div>';requestAnimationFrame(function(){var b=overlayRoot.firstElementChild;if(b)b.classList.add('show')});syncLock()}
function closeOverlay(){var b=overlayRoot.firstElementChild;if(!b){overlayRoot.innerHTML='';syncLock();return}b.classList.remove('show');setTimeout(function(){overlayRoot.innerHTML='';syncLock()},200)}
function confirmBox(o){CF=o;openOverlay('<div class="modal-head" style="justify-content:center"><h3 style="color:'+(o.danger?'#C0453E':'var(--primary-dark)')+'">'+icon(o.danger?'alert':'check',20)+' '+esc(o.title)+'</h3></div><p class="muted" style="font-size:14px;margin-bottom:20px">'+esc(o.msg)+'</p><div style="display:flex;gap:10px"><button class="btn '+(o.danger?'btn-solid-danger':'btn-pr')+'" style="flex:1" onclick="cfOk()">'+esc(o.ok||'تأكيد')+'</button><button class="btn btn-ghost" style="flex:1" onclick="closeOverlay()">تراجع</button></div>')}
function cfOk(){var cb=CF&&CF.onOk;CF=null;closeOverlay();if(cb)cb()}
function toast(msg,type){var t=document.createElement('div');t.className='toast '+(type||'');t.innerHTML=(type==='success'?icon('check',17):(type==='error'||type==='warn')?icon('alert',17):'')+'<span>'+msg+'</span>';toastRoot.appendChild(t);setTimeout(function(){t.classList.add('out');setTimeout(function(){t.remove()},320)},2700)}
function permToast(){toast('هذه العملية تتطلب صلاحيات المالك','warn')}

/* ---------- owner approval (PIN) ---------- */
function openOwnerPIN(cb){OP={pin:'',cb:cb};renderOP('يلزم الحصول على موافقة المالك — أدخل الرقم السري')}
function renderOP(msg){openOverlay('<div class="modal-head" style="justify-content:center"><h3>'+icon('lock',20)+' موافقة المالك</h3></div><p class="muted small" style="margin-bottom:6px">'+esc(msg)+'</p><div class="pin-dots" id="opDots">'+[0,1,2,3].map(function(i){return '<span class="pdot'+(i<OP.pin.length?' f':'')+'"></span>'}).join('')+'</div><div class="keypad">'+[1,2,3,4,5,6,7,8,9].map(function(k){return '<button class="key" onclick="opKey(\''+k+'\')">'+k+'</button>'}).join('')+'<button class="key fn" onclick="closeOverlay()">إلغاء</button><button class="key" onclick="opKey(\'0\')">0</button><button class="key fn" onclick="opKey(\'c\')">مسح</button></div>')}
function opKey(k){if(!OP)return;if(k==='c')OP.pin='';else if(OP.pin.length<4)OP.pin+=k;renderOP('يلزم الحصول على موافقة المالك — أدخل الرقم السري');
 if(OP.pin.length===4)setTimeout(function(){
  if(OP.pin===DB.users.owner.pin){var cb=OP.cb;OP=null;closeOverlay();audit('APPROVE','موافقة المالك على عملية حساسة');toast('تمت موافقة المالك','success');if(cb)cb()}
  else{OP.pin='';var d=el('opDots');if(d)d.classList.add('shake');setTimeout(function(){renderOP('الرقم السري غير صحيح — حاول مجددًا')},350)}
 },160)}

/* ---------- auth & shell ---------- */
function renderLogin(){LOGIN_ROLE=null;LOGIN_PIN='';
 el('root').innerHTML='<div class="login"><div class="login-card card"><div class="brand-big">'+icon('store',38)+'</div><h1>'+esc(DB.settings.storeName)+'</h1><p class="muted small">نظام إدارة المتجر المتكامل — تسجيل الدخول</p><div class="user-pick"><button class="up" id="up-owner" onclick="pickLoginRole(\'owner\')"><span class="up-ic">'+icon('user',26)+'</span><b>المالك</b><small>صلاحيات كاملة</small></button><button class="up" id="up-cashier" onclick="pickLoginRole(\'cashier\')"><span class="up-ic">'+icon('cart',26)+'</span><b>أمين الصندوق</b><small>نقطة البيع فقط</small></button></div><div id="pinArea"></div><div class="demo-hint">نموذج تجريبي (المرحلة الأولى) — الرقم السري للمالك: <b>1234</b> · أمين الصندوق: <b>1111</b></div></div></div>'}
function pickLoginRole(role){LOGIN_ROLE=role;LOGIN_PIN='';var a=el('up-owner'),b=el('up-cashier');if(a)a.classList.toggle('on',role==='owner');if(b)b.classList.toggle('on',role==='cashier');renderPinArea()}
function renderPinArea(){var area=el('pinArea');if(!area)return;if(!LOGIN_ROLE){area.innerHTML='';return}
 area.innerHTML='<p style="margin-top:14px;font-weight:600">أدخل الرقم السري — '+esc(DB.users[LOGIN_ROLE].label)+'</p><div class="pin-dots" id="lgDots">'+[0,1,2,3].map(function(i){return '<span class="pdot'+(i<LOGIN_PIN.length?' f':'')+'"></span>'}).join('')+'</div><div class="keypad">'+[1,2,3,4,5,6,7,8,9].map(function(k){return '<button class="key" onclick="lgKey(\''+k+'\')">'+k+'</button>'}).join('')+'<button class="key fn" onclick="LOGIN_ROLE=null;renderLogin()">تغيير المستخدم</button><button class="key" onclick="lgKey(\'0\')">0</button><button class="key fn" onclick="LOGIN_PIN=\'\';renderPinArea()">مسح</button></div>'}
function lgKey(k){if(LOGIN_PIN.length<4)LOGIN_PIN+=k;renderPinArea();
 if(LOGIN_PIN.length===4)setTimeout(function(){
  if(LOGIN_PIN===DB.users[LOGIN_ROLE].pin){
   var role=LOGIN_ROLE;
   Session.user={role:role,name:DB.users[role].name,label:DB.users[role].label};
   audit('LOGIN','تسجيل دخول إلى النظام');
   renderShell();go(role==='cashier'?'pos':'dashboard');
   toast('مرحبًا بك، '+Session.user.name+' 👋','success');
  }else{
   LOGIN_PIN='';var d=el('lgDots');if(d)d.classList.add('shake');
   toast('الرقم السري غير صحيح','error');setTimeout(renderPinArea,380);
  }
 },160)}
function logout(){audit('LOGOUT','تسجيل خروج من النظام');Session.user=null;closeModal();closeOverlay();renderLogin()}
function navItems(){return NAV.filter(function(n){return n.roles.indexOf(Session.user.role)>-1})}
function allowed(v){var n=null;for(var i=0;i<NAV.length;i++){if(NAV[i].id===v){n=NAV[i];break}}return !!(n&&Session.user&&n.roles.indexOf(Session.user.role)>-1)}
function renderShell(){
 el('root').innerHTML='<aside class="sidebar" id="sidebar"></aside><div class="main"><header class="topbar" id="topbar"></header><main class="view-wrap"><div id="view" class="view"></div></main></div><nav class="bottomnav" id="bottomnav"></nav>';
 renderNav()}
function renderNav(){
 if(!Session.user)return;
 var items=navItems(),sb=el('sidebar'),bn=el('bottomnav');
 if(sb)sb.innerHTML='<div class="brand"><div class="brand-ic">'+icon('store',24)+'</div><div><b>'+esc(DB.settings.storeName)+'</b><small>نظام الإدارة المتكامل</small></div></div><nav class="side-nav">'+items.map(function(n){return '<button class="nav-it'+(state.view===n.id?' active':'')+'" onclick="go(\''+n.id+'\')"><span class="ni-ic">'+icon(n.ic,20)+'</span>'+n.label+'</button>'}).join('')+'</nav><div class="side-foot">المرحلة 1 · نموذج ببيانات تجريبية<br>الإصدار 1.4 — العملة: '+esc(DB.settings.currency)+'</div>';
 if(!bn)return;
 if(items.length<=5){bn.innerHTML=items.map(function(n){return '<button class="bn-it'+(state.view===n.id?' active':'')+'" onclick="go(\''+n.id+'\')"><span class="bni">'+icon(n.ic,22)+'</span>'+n.label+'</button>'}).join('')}
 else{
  var first=items.slice(0,4),rest=items.slice(4);
  bn.innerHTML=first.map(function(n){return '<button class="bn-it'+(state.view===n.id?' active':'')+'" onclick="go(\''+n.id+'\')"><span class="bni">'+icon(n.ic,22)+'</span>'+n.label+'</button>'}).join('')
  +'<button class="bn-it'+(rest.some(function(r){return r.id===state.view})?' active':'')+'" onclick="openMoreSheet()"><span class="bni">'+icon('more',22)+'</span>المزيد</button>';
 }}
function openMoreSheet(){var rest=navItems().slice(4);
 openModal('<div class="modal-head"><h3>'+icon('more',20)+' باقي الأقسام</h3><button class="icon-btn sm" onclick="closeModal()">'+icon('x',18)+'</button></div><div class="more-grid">'+rest.map(function(n){return '<button class="more-it" onclick="closeModal();go(\''+n.id+'\')"><span class="ni-ic">'+icon(n.ic,22)+'</span>'+n.label+'</button>'}).join('')+'</div>')}
function renderHeader(){
 var tb=el('topbar');if(!tb||!Session.user)return;
 var n=null;for(var i=0;i<NAV.length;i++){if(NAV[i].id===state.view){n=NAV[i];break}}
 if(!n)n=NAV[1];
 tb.innerHTML='<div class="tb-titles"><h1>'+n.label+'</h1><p>'+(VIEW_SUB[n.id]||'')+'</p></div><div class="tb-side"><span class="chip date-chip">'+icon('calendar',15)+' '+fmtLong(new Date())+'</span><span class="chip user-chip">'+icon('user',15)+' <span>'+esc(Session.user.name)+'</span></span><button class="icon-btn" title="تسجيل الخروج" onclick="logout()">'+icon('logout',19)+'</button></div>'}
function go(v){if(!Session.user){renderLogin();return}if(!allowed(v))v='pos';state.view=v;renderNav();renderHeader();renderView(true);window.scrollTo({top:0})}
function refresh(){if(!Session.user||!el('view'))return;renderHeader();renderView(false)}
function renderView(anim){
 var v=el('view');if(!v)return;
 v.classList.remove('anim');
 var map={dashboard:renderDashboard,pos:renderPOS,purchases:renderPurchases,sales:renderSales,debts:renderDebts,inventory:renderInventory,reports:renderReports,settings:renderSettings};
 var fn=map[state.view]||renderPOS;
 v.innerHTML=fn();
 if(anim){void v.offsetWidth;v.classList.add('anim')}}

/* ================= DASHBOARD ================= */
function renderDashboard(){
 var t=new Date();
 var todayS=DB.sales.filter(function(s){return sameDay(s.date,t)&&s.status!=='voided'});
 var todayNet=todayS.reduce(function(a,s){return a+s.total},0),todayProfit=todayS.reduce(function(a,s){return a+s.profit},0);
 var yNet=DB.sales.filter(function(s){return sameDay(s.date,addDays(t,-1))&&s.status!=='voided'}).reduce(function(a,s){return a+s.total},0);
 var delta=yNet?Math.round((todayNet-yNet)/yNet*100):100;
 var low=lowProducts(),cD=custDebt(),sD=suppDebt();
 var recent=DB.sales.slice().sort(function(a,b){return dateMs(b.date)-dateMs(a.date)}).slice(0,5);
 return '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px"><div><h2 style="font-size:20px;font-weight:700">أهلًا بك، '+esc(Session.user.name)+' 👋</h2><p class="muted small">هذا ملخص أداء المتجر — '+fmtLong(t)+'</p></div></div>'
 +'<div class="kpi-grid">'
 +kpi('cash',TINTS.teal,'<div class="kpi-val">'+money(todayNet)+'</div><div class="kpi-lbl">صافي مبيعات اليوم</div><span class="kpi-delta '+(delta>=0?'b-green':'b-red')+'">'+(delta>=0?'▲':'▼')+' '+Math.abs(delta)+'%</span>',"go('sales')")
 +kpi('trend',TINTS.green,'<div class="kpi-val">'+money(todayProfit)+'</div><div class="kpi-lbl">ربح اليوم (بعد المرتجعات)</div>',"go('reports')")
 +kpi('wallet',TINTS.orange,'<div class="kpi-val">'+money(cD)+'</div><div class="kpi-lbl">ديون على العملاء (لنا)</div>',"go('debts')")
 +kpi('wallet',TINTS.red,'<div class="kpi-val">'+money(sD)+'</div><div class="kpi-lbl">ديون مستحقة للموردين (علينا)</div>',"go('debts')")
 +kpi('box',TINTS.blue,'<div class="kpi-val">'+money(invValue())+'</div><div class="kpi-lbl">قيمة المخزون الحالية · '+DB.products.length+' منتج</div>',"go('inventory')")
 +kpi('alert',low.length?TINTS.red:TINTS.green,'<div class="kpi-val">'+low.length+'</div><div class="kpi-lbl">منتجات وصلت لحد التنبيه</div>',"go('inventory')")
 +'</div>'
 +'<div class="quick-row"><button class="btn btn-pr" onclick="go(\'pos\')">'+icon('cart',18)+' بيع جديد</button><button class="btn btn-ghost" onclick="openPurchaseModal()">'+icon('boxin',18)+' فاتورة شراء</button><button class="btn btn-ghost" onclick="openProductModal()">'+icon('plus',18)+' منتج جديد</button><button class="btn btn-ghost" onclick="openDebtModal()">'+icon('wallet',18)+' تسجيل دين</button></div>'
 +'<div class="grid-2-1"><div class="card"><div class="card-head"><h3>'+icon('chart',19)+' المبيعات — آخر 7 أيام</h3><span class="lgd"><i style="background:var(--primary)"></i> صافي المبيعات</span><span class="lgd"><i style="background:#5E7D77"></i> الربح</span></div>'+chartBars(lastDays(7))+'</div>'
 +'<div style="display:flex;flex-direction:column;gap:16px"><div class="card"><div class="card-head"><h3>'+icon('receipt',19)+' أحدث الفواتير</h3><button class="chip" onclick="go(\'sales\')">عرض الكل</button></div>'
 +(recent.length?recent.map(function(s){return '<div class="mini-row"><div><b>#'+s.no+'</b> <span class="muted small">'+esc(s.customerName)+'</span><div class="muted small">'+fmtDT(s.date)+'</div></div><div style="display:flex;align-items:center;gap:8px"><span class="badge '+STATUS_CLS[s.status]+'">'+STATUS_AR[s.status]+'</span><b>'+money(s.status==='voided'?0:s.total)+'</b></div></div>'}).join(''):'<div class="empty">لا توجد فواتير بعد</div>')
 +'</div><div class="card"><div class="card-head"><h3 style="color:#B26B12">'+icon('alert',19)+' تنبيهات المخزون</h3><button class="chip" onclick="go(\'inventory\')">المخزون</button></div>'
 +(low.length?low.slice(0,5).map(function(p){return '<div class="mini-row"><div class="flex">'+catOf(p.category).emoji+' <b>'+esc(p.name)+'</b></div><span class="badge '+(p.quantity===0?'b-red':'b-orange')+'">'+(p.quantity===0?'نفد':'متبقي '+p.quantity)+'</span></div>'}).join(''):'<div class="empty" style="padding:16px">المخزون بحالة جيدة ✅</div>')
 +'</div></div></div>'}

/* ================= POS ================= */
function renderPOS(){
 return '<div class="pos-grid"><div><div class="card"><div class="pos-toolbar"><div class="search-box">'+icon('search',18)+'<input class="inp" id="posSearch" placeholder="ابحث بالاسم أو امسح الباركود…" value="'+esc(state.posQ)+'" oninput="posSearch(this.value)" onkeydown="posSearchKey(event)"></div></div><div class="cat-row" id="posCats">'+posCatsHTML()+'</div></div><div class="prod-grid" id="posGrid">'+posGridHTML()+'</div></div>'
 +'<aside class="card cart-panel" id="posCart">'+cartHTML()+'</aside></div>'
 +'<div class="pos-hints">اختصارات: <span><kbd>F2</kbd> بحث</span><span><kbd>Enter</kbd> إضافة أول نتيجة</span><span><kbd>F9</kbd> إتمام البيع</span><span><kbd>Esc</kbd> إغلاق</span></div>'}
function posCatsHTML(){return '<button class="chip'+(state.posCat==='all'?' on':'')+'" onclick="setPosCat(\'all\')">الكل</button>'+CATS.map(function(c){return '<button class="chip'+(state.posCat===c.id?' on':'')+'" onclick="setPosCat(\''+c.id+'\')">'+c.emoji+' '+c.name+'</button>'}).join('')}
function posGridHTML(){
 var q=state.posQ.trim();
 var list=DB.products.filter(function(p){return (state.posCat==='all'||p.category===state.posCat)&&(!q||p.name.indexOf(q)>-1||p.barcode.indexOf(q)>-1)});
 if(!list.length)return '<div class="empty" style="grid-column:1/-1">'+icon('search',40)+'<br>لا توجد منتجات مطابقة للبحث</div>';
 return list.map(function(p){
  var c=catOf(p.category),out=p.quantity<=0;
  return '<button class="prod-card'+(out?' out':'')+'" onclick="addToCart(\''+p.id+'\')" '+(out?'disabled':'')+'><span class="pc-emoji" style="background:'+c.tint+'">'+c.emoji+'</span><span class="pc-name">'+esc(p.name)+'</span><span class="pc-price">'+money(p.sellPrice)+'</span><span class="pc-stock '+(out?'out':p.quantity<=p.minAlert?'low':'')+'">'+(out?'نفد المخزون':'متوفر: '+p.quantity)+'</span></button>'
 }).join('')}
function posSearch(v){state.posQ=v;var g=el('posGrid');if(g)g.innerHTML=posGridHTML()}
function setPosCat(c){state.posCat=c;var cs=el('posCats'),g=el('posGrid');if(cs)cs.innerHTML=posCatsHTML();if(g)g.innerHTML=posGridHTML()}
function posSearchKey(e){if(e.key==='Enter'){var q=state.posQ.trim();if(!q)return;var exact=null,i;for(i=0;i<DB.products.length;i++){if(DB.products[i].barcode===q){exact=DB.products[i];break}}if(!exact){for(i=0;i<DB.products.length;i++){if(DB.products[i].name.indexOf(q)>-1){exact=DB.products[i];break}}}if(exact){addToCart(exact.id);state.posQ='';var se=el('posSearch');if(se)se.value='';var g=el('posGrid');if(g)g.innerHTML=posGridHTML()}e.preventDefault()}}
function cartCount(){return state.cart.reduce(function(a,c){return a+c.qty},0)}
function cartSubtotal(){return state.cart.reduce(function(a,c){var p=prod(c.pid);return a+(p?p.sellPrice*c.qty:0)},0)}
function addToCart(pid){var p=prod(pid);if(!p||p.quantity<=0)return;var row=null;for(var i=0;i<state.cart.length;i++){if(state.cart[i].pid===pid){row=state.cart[i];break}}
 if(row){if(row.qty>=p.quantity){toast('وصلت للحد الأقصى المتوفر من هذا المنتج','warn');return}row.qty++}else state.cart.push({pid:pid,qty:1});
 renderCartOnly()}
function cartQty(pid,d){var row=null,i;for(i=0;i<state.cart.length;i++){if(state.cart[i].pid===pid){row=state.cart[i];break}}if(!row)return;var p=prod(pid);
 if(d>0&&row.qty>=p.quantity){toast('الكمية المطلوبة غير متوفرة بالمخزون','warn');return}
 row.qty+=d;if(row.qty<=0)state.cart=state.cart.filter(function(c){return c.pid!==pid});renderCartOnly()}
function cartRemove(pid){state.cart=state.cart.filter(function(c){return c.pid!==pid});renderCartOnly()}
function clearCart(){if(!state.cart.length)return;state.cart=[];state.discount=0;renderCartOnly()}
function setDiscount(v){state.discount=Math.max(0,parseFloat(v)||0);var sub=cartSubtotal();var e1=el('totDisc');if(e1)e1.textContent='− '+money(Math.min(state.discount,sub));var e2=el('totGrand');if(e2)e2.textContent=money(sub-Math.min(state.discount,sub))}
function renderCartOnly(){var c=el('posCart');if(c)c.innerHTML=cartHTML()}
function cartHTML(){
 var sub=cartSubtotal(),disc=Math.min(state.discount,sub),total=sub-disc;
 var html='<div class="card-head" style="margin-bottom:8px"><h3>'+icon('cart',20)+' السلة <span class="badge b-teal">'+cartCount()+' صنف</span></h3>'+(state.cart.length?'<button class="chip" style="color:#C0453E" onclick="clearCart()">'+icon('trash',14)+' إفراغ</button>':'')+'</div>';
 if(state.cart.length){
  html+=state.cart.map(function(c){var p=prod(c.pid);if(!p)return '';
   return '<div class="ci"><div class="ci-top"><span class="ci-name">'+esc(p.name)+'<span class="ci-unit">'+money(p.sellPrice)+' للوحدة</span></span><button class="ci-del" onclick="cartRemove(\''+p.id+'\')">'+icon('trash',16)+'</button></div><div class="ci-ctrl"><span class="qty"><button onclick="cartQty(\''+p.id+'\',-1)">−</button><b>'+c.qty+'</b><button onclick="cartQty(\''+p.id+'\',1)">+</button></span><span class="ci-total">'+money(p.sellPrice*c.qty)+'</span></div></div>'}).join('');
 }else{
  html+='<div class="empty">'+icon('cart',42)+'<br>السلة فارغة — اختر منتجات للبدء</div>';
 }

function remQty(s,pid){
 var it=null;for(var i=0;i<s.items.length;i++){if(s.items[i].productId===pid){it=s.items[i];break}}
 if(!it)return 0;
 return it.qty-s.returns.reduce(function(a,r){var f=null;for(var x=0;x<r.items.length;x++){if(r.items[x].productId===pid){f=r.items[x];break}}return a+(f?f.qty:0)},0)}

 +'<label class="lbl">حدد الكميات المرتجعة (0 = عدم الإرجاع)</label>'+rows

 else{chosen=s.items.filter(function(i){return (RF.sel[i.productId]||0)>0}).map(function(i){return{productId:i.productId,name:i.name,qty:RF.sel[i.productId],price:i.price}})}
 var refund=chosen.reduce(function(a,c){return a+c.price*c.qty},0);
 var impacts=['إعادة الكميات المرتجعة إلى المخزون تلقائيًا','تسجيل العملية في سجل العمليات باسم: '+esc(Session.user.name)];
 if(s.paymentType==='debt')impacts.push('تخفيض رصيد دين العميل «'+esc(s.customerName)+'» بمبلغ '+money(refund));
 else impacts.push('تسجيل صرف نقدي من الخزينة بقيمة '+money(refund));
 if(RF.mode==='void')impacts.push('استبعاد الفاتورة نهائيًا من كل الإجماليات والتقارير');
 else impacts.push('إعادة احتساب صافي الفاتورة وأرباحها دون حذف الأصل');
 openModal('<div class="modal-head"><h3 style="color:#C0453E">'+icon('alert',20)+' تأكيد '+(RF.mode==='void'?'الإلغاء':'المرتجع')+'</h3><button class="icon-btn sm" onclick="closeModal()">'+icon('x',18)+'</button></div>'
 +'<p class="muted small">فاتورة #'+s.no+' · '+fmtDT(s.date)+' · '+esc(s.customerName)+'</p>'
 +'<div class="tbl-wrap" style="margin:12px 0"><table class="tbl" style="min-width:0"><thead><tr><th>الصنف</th><th>كمية</th><th>قيمة مستردة</th></tr></thead><tbody>'
 +chosen.map(function(c){return '<tr><td>'+esc(c.name)+'</td><td>'+c.qty+'</td><td>'+money(c.price*c.qty)+'</td></tr>'}).join('')+'</tbody></table></div>'
 +'<div class="tot-row gr"><span>إجمالي المبلغ المسترد</span><span style="color:#C0453E">'+money(refund)+'</span></div>'

 +(RF.reason?'<p class="small muted">السبب: '+esc(RF.reason)+'</p>':'')
 +'<div style="display:flex;gap:10px;margin-top:16px"><button class="btn btn-ghost" style="flex:1" onclick="openModal(rfStep1HTML(),\'lg\')">تراجع</button><button class="btn btn-solid-danger" style="flex:2" onclick="rfApply()">'+icon('check',18)+' تأكيد '+(RF.mode==='void'?'الإلغاء النهائي':'المرتجع')+'</button></div>','lg')}
function rfApply(){var s=saleById(RF.saleId);if(!s||!RF)return;
 var chosen;
 if(RF.mode==='void'){chosen=s.items.map(function(i){return{productId:i.productId,qty:remQty(s,i.productId),price:i.price,cost:i.cost}}).filter(function(c){return c.qty>0})}
 else{chosen=s.items.filter(function(i){return (RF.sel[i.productId]||0)>0}).map(function(i){return{productId:i.productId,qty:RF.sel[i.productId],price:i.price,cost:i.cost}})}
 var refund=chosen.reduce(function(a,c){return a+c.price*c.qty},0);
 chosen.forEach(function(c){var p=prod(c.productId);if(p)p.quantity+=c.qty});
 s.returns.push({date:new Date().toISOString(),mode:RF.mode,items:chosen,refund:refund,reason:RF.reason,user:Session.user.name});
 s.returnedValue+=refund;
 if(RF.mode==='void'){s.status='voided'}
 else{
  s.total-=refund;
  s.profit-=chosen.reduce(function(a,c){return a+(c.price-c.cost)*c.qty},0);
  s.status=s.items.every(function(i){return remQty(s,i.productId)===0})?'returned':'partial';
 }
 if(s.paymentType==='debt'){
  var d=null;for(var i=0;i<DB.debts.length;i++){if(DB.debts[i].saleId===s.id&&DB.debts[i].type==='customer'){d=DB.debts[i];break}}
  if(d){d.remaining=Math.max(0,d.remaining-refund);d.status=d.remaining>0?'active':'settled'}
 }
 audit(RF.mode==='void'?'VOID':'RETURN',(RF.mode==='void'?'إلغاء':'مرتجع')+' فاتورة #'+s.no+' بقيمة '+money(refund)+(RF.reason?' — '+RF.reason:''));
 var m=RF.mode;RF=null;closeModal();refresh();toast(m==='void'?'تم إلغاء الفاتورة وإعادة الكميات للمخزون':'تم تسجيل المرتجع بنجاح','success')}

 +(top.length?top.map(function(t,i){return '<div class="mini-row"><span class="flex"><b class="badge b-teal">'+(i+1)+'</b> '+esc(t.name)+'</span><span class="small muted">'+t.units+' وحدة · <b style="color:var(--ink)">'+money(t.rev)+'</b></span></div>'}).join(''):'<div class="empty">لا توجد بيانات في هذه الفترة</div>')
 +'</div></div>'
 +'<div class="grid-2" style="margin-top:16px"><div class="card"><div class="card-head"><h3 style="color:#C0453E">'+icon('undo',19)+' سجل المرتجعات والإلغاءات</h3></div>'
 +(rets.length?'<div class="tbl-wrap"><table class="tbl" style="min-width:520px"><thead><tr><th>التاريخ</th><th>فاتورة</th><th>النوع</th><th>المبلغ</th><th>بواسطة</th><th>السبب</th></tr></thead><tbody>'
 +rets.map(function(r){return '<tr><td class="small muted">'+fmtDT(r.date)+'</td><td class="nm">#'+r.invoice+'</td><td><span class="badge '+(r.mode==='void'?'b-gray':'b-red')+'">'+(r.mode==='void'?'إلغاء':'مرتجع')+'</span></td><td><b>'+money(r.refund)+'</b></td><td class="small">'+esc(r.user)+'</td><td class="small muted">'+esc(r.reason||'—')+'</td></tr>'}).join('')
 +'</tbody></table></div>':'<div class="empty">'+icon('check',38)+'<br>لا توجد مرتجعات في هذه الفترة</div>')
 +'</div>'
 +'<div class="card"><div class="card-head"><h3>'+icon('clock',19)+' سجل العمليات (التدقيق)</h3></div>'
 +DB.audit.slice(0,12).map(function(a){return '<div class="mini-row"><div><span class="badge b-teal">'+(ACTION_AR[a.action]||a.action)+'</span> <span class="small">'+esc(a.details)+'</span><div class="muted small">'+esc(a.user)+' · '+fmtDT(a.time)+'</div></div></div>'}).join('')

function repPeriod(p){state.repPeriod=p;refresh()}
function exportCSV(){
 var rows=[['رقم الفاتورة','التاريخ','العميل','طريقة الدفع','الإجمالي','الربح','الحالة']];
 DB.sales.forEach(function(s){rows.push([s.no,fmtFull(s.date),s.customerName,s.paymentType==='cash'?'نقدي':'آجل',s.total,s.profit,STATUS_AR[s.status]])});
 var csv='\ufeff'+rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"'}).join(',')}).join('\n');
 var a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
 a.download='osama-market-sales.csv';a.click();
 toast('تم تصدير تقرير المبيعات (CSV)','success')}

/* ================= SETTINGS ================= */

 var st=DB.settings;
 return '<div class="grid-2"><div class="card"><div class="card-head"><h3>'+icon('store',19)+' بيانات المتجر</h3></div>'
 +'<div class="field"><label class="lbl">اسم المتجر</label><input class="inp" id="stName" value="'+esc(st.storeName)+'"></div>'
 +'<div class="field"><label class="lbl">العملة</label><select class="inp" id="stCur">'+CURS.map(function(c){return '<option'+(st.currency===c?' selected':'')+'>'+c+'</option>'}).join('')+'</select></div>'
 +'<button class="btn btn-pr" onclick="saveStore()">'+icon('check',17)+' حفظ بيانات المتجر</button></div>'
 +'<div class="card"><div class="card-head"><h3>'+icon('lock',19)+' الصلاحيات وقواعد المرتجعات</h3></div>'
 +'<div class="field"><label class="lbl">مهلة الإلغاء الفوري للكاشير (دقائق)</label><input type="number" min="0" max="1440" class="inp" id="stVoid" value="'+st.voidWindowMin+'"></div>'
 +'<div class="mini-row"><div><b>مرتجعات الكاشير تتطلب موافقة المالك</b><div class="muted small">عند التفعيل يُطلب الرقم السري للمالك (1234) قبل أي مرتجع</div></div><label class="tgl"><input type="checkbox" id="stReqOwner" '+(st.returnsRequireOwner?'checked':'')+'><span class="tr"></span></label></div>'
 +'<div class="mini-row"><div><b>عرض المخزون لأمين الصندوق</b><div class="muted small">عرض فقط بدون تعديل</div></div><label class="tgl"><input type="checkbox" id="stInv" '+(st.cashierInventory?'checked':'')+'><span class="tr"></span></label></div>'
 +'<button class="btn btn-pr" style="margin-top:10px" onclick="savePerms()">'+icon('check',17)+' حفظ الصلاحيات</button>'
 +'<div style="margin-top:16px;border-top:1px dashed var(--line);padding-top:14px"><label class="lbl">مستخدمو النظام</label>'
 +'<div class="mini-row"><span class="flex">'+icon('user',17)+' <b>'+esc(DB.users.owner.name)+'</b> <span class="badge b-teal">مالك — صلاحيات كاملة</span></span><span class="muted small">PIN: 1234</span></div>'
 +'<div class="mini-row"><span class="flex">'+icon('cart',17)+' <b>'+esc(DB.users.cashier.name)+'</b> <span class="badge b-gray">أمين صندوق</span></span><span class="muted small">PIN: 1111</span></div>'
 +'<p class="muted small">ملاحظة: في المرحلة الثانية تُخزَّن كلمات المرور مشفرة (bcrypt) مع تشفير قاعدة البيانات AES-256.</p></div></div>'
 +'<div class="card"><div class="card-head"><h3>'+icon('download',19)+' النسخ الاحتياطي والاستعادة</h3></div>'
 +'<div class="flex" style="flex-wrap:wrap"><button class="btn btn-soft" onclick="doBackup()">'+icon('download',17)+' تنزيل نسخة احتياطية</button>'
 +'<label class="btn btn-ghost" style="cursor:pointer">'+icon('upload',17)+' استعادة من ملف<input type="file" accept=".json" style="display:none" onchange="restoreFile(event)"></label>'
 +'<button class="btn btn-danger" onclick="resetDemo()">'+icon('refresh',17)+' إعادة تعيين البيانات التجريبية</button></div>'
 +'<p class="muted small" style="margin-top:10px">النسخة الاحتياطية ملف JSON يشمل المنتجات والمبيعات والمشتريات والديون والسجل والإعدادات.</p></div>'
 +'<div class="card"><div class="card-head"><h3>'+icon('gear',19)+' اللغة والمظهر</h3></div>'
 +'<div class="mini-row"><div><b>العربية</b><div class="muted small">اللغة الافتراضية والمعتمدة للتطبيق</div></div><span class="badge b-green">مفعّلة</span></div>'
 +'<div class="mini-row"><div><b>English</b><div class="muted small">اختيارية — تتوفر في مرحلة لاحقة</div></div><span class="badge b-gray">قريبًا</span></div>'
 +'<div class="mini-row"><div><b>الوضع الداكن</b><div class="muted small">ميزة اختيارية غير مطلوبة في المرحلة الأولى</div></div><span class="badge b-gray">قريبًا</span></div></div></div>'}
function saveStore(){
 DB.settings.storeName=el('stName').value.trim()||'سوق أسامة';
 DB.settings.currency=el('stCur').value;
 audit('SETTINGS','تحديث بيانات المتجر — العملة: '+DB.settings.currency);
 renderNav();refresh();toast('تم حفظ بيانات المتجر','success')}
function savePerms(){
 DB.settings.voidWindowMin=Math.max(0,Math.min(1440,parseInt(el('stVoid').value)||0));
 DB.settings.returnsRequireOwner=el('stReqOwner').checked;
 DB.settings.cashierInventory=el('stInv').checked;
 audit('SETTINGS','تحديث الصلاحيات وقواعد المرتجعات');refresh();toast('تم حفظ الصلاحيات','success')}
function doBackup(){
 var data={settings:DB.settings,products:DB.products,sales:DB.sales,purchases:DB.purchases,debts:DB.debts,audit:DB.audit,seq:DB.seq,pseq:DB.pseq};
 var a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
 a.download='osama-market-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();
 toast('تم تنزيل النسخة الاحتياطية','success')}
function restoreFile(ev){
 var f=ev.target.files[0];if(!f)return;
 var r=new FileReader();
 r.onload=function(){
  try{
   var j=JSON.parse(r.result);
   if(!j.products||!j.sales||!j.settings)throw new Error('bad file');
   DB.products=j.products;DB.sales=j.sales;DB.purchases=j.purchases||[];DB.debts=j.debts||[];
   DB.audit=j.audit||[];DB.settings=j.settings;DB.seq=j.seq||9999;DB.pseq=j.pseq||999;
   audit('RESTORE','استعادة نسخة احتياطية من ملف');
   renderNav();refresh();toast('تمت الاستعادة بنجاح','success');
  }catch(e){toast('ملف النسخة الاحتياطية غير صالح','error')}
 };
 r.readAsText(f);ev.target.value=''}
function resetDemo(){confirmBox({title:'إعادة تعيين البيانات التجريبية',msg:'سيتم استبدال جميع البيانات الحالية بالبيانات التجريبية الأصلية.',ok:'إعادة التعيين',danger:true,onOk:function(){
 seed();audit('RESET','إعادة تعيين البيانات التجريبية');renderNav();refresh();toast('تمت إعادة التعيين','success');
 }})}

/* ---------- global keyboard shortcuts ---------- */
document.addEventListener('keydown',function(e){
 if(e.key==='Escape'){
  if(overlayRoot.innerHTML){closeOverlay();return}
  if(modalRoot.innerHTML){closeModal();return}
 }
 if(!Session.user||state.view!=='pos')return;
 if(e.key==='F2'){e.preventDefault();var s=el('posSearch');if(s)s.focus()}
 if(e.key==='F9'){e.preventDefault();if(modalRoot.innerHTML)return;openPayment()}});

/* ---------- boot ---------- */
try{
 seed();
 renderLogin();
}catch(err){
 document.body.innerHTML='<div style="padding:40px;font-family:sans-serif;direction:rtl;color:#C0453E;max-width:640px;margin:0 auto"><h2 style="margin-bottom:10px">حدث خطأ أثناء تشغيل التطبيق</h2><p style="color:#555;margin-bottom:14px">يرجى إرسال التفاصيل التالية:</p><pre style="background:#fff;border:1px solid #eee;padding:14px;border-radius:10px;white-space:pre-wrap;font-size:12px">'+esc(err&&err.stack?err.stack:String(err))+'</pre></div>';
}
